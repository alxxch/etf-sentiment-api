services:
  # Servicio de Base de Datos Relacional PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: etf_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-etf_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-etf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio de Broker y Backend Redis
  redis:
    image: redis:alpine
    container_name: etf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio API REST FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etf_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-etf_db}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker asíncrono de Celery con Beat (Scheduler Cron diario a las 18:00 CET)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etf_celery_worker
    restart: unless-stopped
    command: celery -A celery_app.celery_app worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-etf_db}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
